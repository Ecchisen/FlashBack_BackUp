services:
  flashback-backend:
    build: ./flashback-backend
    container_name: flashback-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./flashback-backend/.env
    volumes:
      - /data/FlashBack/uploads:/app/uploads
    networks:
      - flashback-net

  flashback-frontend:
    build: ./flashback-frontend
    container_name: flashback-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - flashback-backend
    networks:
      - flashback-net

  flashback-gallery:
    image: filebrowser/filebrowser:v2.32.0
    container_name: flashback-gallery
    restart: unless-stopped
    command: --database=/database/filebrowser.db --root=/srv --baseurl=""
    ports:
      - "8001:80"
    volumes:
      - /data/FlashBack/uploads:/srv
      - /data/FlashBack/filebrowser-data:/database
    networks:
      - flashback-net

networks:
  flashback-net:
    name: flashback_flashback-net
    external: true